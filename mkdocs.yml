site_name: AI Chat Orchestrator Project
site_description: "A professional-grade microservices architecture integrating AI-powered chat systems with Discord, Slack, Jira, and Google Tasks. Built with component-based design, dependency injection, and comprehensive testing."

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - 'Overview': 'index.md'
  - 'Architecture': 'component.md'
  - 'Testing Guide': 'testing.md'
  - 'API Reference':
    - 'AI Client API': 'api/ai_client_api.md'
    - 'Gemini Client Implementation': 'api/gemini_client_impl.md'
    - 'Gemini AI Service': 'api/gemini_service.md'
    - 'Chat Client API': 'api/chat_client_api.md'
    - 'Discord Client Implementation': 'api/discord_client_impl.md'
    - 'Slack Client Implementation': 'api/slack_impl.md'
    - 'Ticket API': 'api/ticket_api.md'
    - 'Jira Client Implementation': 'api/jira_client_impl.md'
    - 'Google Tasks Implementation': 'api/gtask_client_impl.md'
    - 'AI Chat Orchestrator': 'api/ai_chat_orchestrator.md'
    - 'Orchestrator Service': 'api/orchestrator_service.md'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src/ai_client_api/src
            - src/gemini_client_impl/src
            - src/gemini_adapter/src
            - src/gemini_service/src
            - src/chat-client-api/src
            - src/discord_client_impl/src
            - src/slack_impl/src
            - src/slack_adapter/src
            - src/ticket_api/src
            - src/jira_client_impl/src
            - src/gtask_client_impl/src
            - src/task_client_service/src
            - src/ai_chat_orchestrator/src
            - src/orchestrator_service/src
          options:
            show_source: false
            docstring_section_style: spacy
            members_order: source
