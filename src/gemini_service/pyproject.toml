extend = "../../pyproject.toml"

[project]
name = "gemini-service"
version = "0.1.0"
description = "FastAPI service exposing Gemini AI chat functionality over HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "gemini-api",
    "gemini-impl",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
gemini-api = { workspace = true }
gemini-impl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_service"]

