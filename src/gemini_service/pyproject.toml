extend = "../../pyproject.toml"

[project]
name = "gemini-service"
version = "0.1.0"
description = "FastAPI service exposing Gemini AI chat functionality over HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "ai-client-api",
    "gemini-client-impl",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_service"]

