extend = "../../pyproject.toml"

[project]
name = "orchestrator-service"
version = "0.1.0"
description = "FastAPI service orchestrating AI and Chat integrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "ai-client-api",
    "gemini-client-impl",
    "chat-client-api",
    "discord-client-impl",
    "ai-chat-orchestrator",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "ticket-api",
    "ticket-impl",
    "tickets-api",
    "tickets-client-impl",
    "task-client-service",
    "gtask-client-impl",
    "discord-py>=2.6.4",
    "slack-impl",
    "google-cloud-monitoring>=2.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_service"]
