[project]
name = "ta-assignment"
version = "0.1.0"
description = "Template repository for a mail client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "types-requests>=2.32.4.20250913",
]

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.30.0",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.1.0",
    "ruff>=0.12.7",
    "types-requests>=2.32.4.20250611",
]

[tool.uv.workspace]
members = [
  "src/mail_client_api",
  "src/gmail_client_impl",
  "src/mail_client_service",
  "src/mail_client_service_client",
  "src/mail_client_adapter",
  "src/ai_client_api",
  "src/gemini_client_impl",
  "src/gemini_service",
  "src/gemini_ai_service_client",
  "src/gemini_adapter",
  "src/chat-client-api",
  "src/slack_impl",
  "src/slack_service",
  "src/slack_adapter",
  "src/discord_client_impl",
  "src/discord_client_service",
  "src/discord_client_service_client",
  "src/discord_client_service_adapter",
]

[tool.ruff]
line-length = 130 # high for top level due to tests
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "D203", # `incorrect-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible. Ignoring `incorrect-blank-line-before-class`.
  "D213", # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`.
  "S101", # Use of `assert` detected --> Asserts are good in our opinion. Tests use asserts profusely.
  "PLW0603", # Using global statement - needed for singleton pattern in tests
  "TRY300", # Style preference: code properly handles exceptions
]

[tool.ruff.lint.per-file-ignores]
# Test files - ignore docstrings and type annotation requirements
"**/test_*.py" = ["D100", "D101", "D102", "D103", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202"]
# Auto-generated clients - ignore all linting rules
"src/mail_client_service_client/**/*.py" = ["ALL"]
"src/gemini_ai_service_client/**/*.py" = ["ALL"]

[tool.mypy]
strict = true
explicit_package_bases = true # Required for src layout
mypy_path = ["src/mail_client_api/src", "src/gmail_client_impl/src", "src/mail_client_service/src", "src/mail_client_service_client/src", "src/mail_client_adapter/src", "src/ai_client_api/src", "src/gemini_client_impl/src", "src/gemini_service/src", "src/gemini_ai_service_client", "src/gemini_adapter/src"]
ignore_missing_imports = false
warn_unused_ignores = false
exclude = ["tests/", ".*/tests/.*", "src/mail_client_service_client/", "src/gemini_ai_service_client/", "src/gemini_client_impl/", "src/mail_client_service/", "src/gemini_adapter/", "src/test_app.py"]


[tool.pytest.ini_options]
pythonpath = [
    ".", 
    "src"
]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]

[tool.coverage.run]
source = ["src"]
# For CircleCI: mail_client_service requires external service, so omit it
# Note: mail_client_adapter and gmail_client_impl can't be tested without the service
omit = ["*/tests/*", "*/__main__.py", "*/generated/*", "*/mail_client_service_api_client/*", "*/gemini_ai_service_client/*", "*/mail_client_service/*", "*/mail_client_adapter/*", "*/gmail_client_impl/*"]

[tool.coverage.report]
fail_under = 80 # Justification: CircleCI can only test modules without external services; full test suite (with service running) achieves 85%+
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest==8.4.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
]
