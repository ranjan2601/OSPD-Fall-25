# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define jobs to be invoked later in a workflow.
jobs:
  # Job 1: Setup Environment and Install All Dependencies
  build:
    docker:
      - image: cimg/python:3.11 # Use a consistent Python version
    steps:
      - checkout
      - run:
          name: "Install UV and Add to Path"
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version # Verify installation
      - run:
          name: "Create Virtual Env & Install All Dependencies via UV Sync"
          command: |
            # Create venv in the default .venv location
            uv venv --python 3.11
            source .venv/bin/activate
            # Install all dependencies including dev/test extras
            uv sync --all-packages --extra dev --verbose
      - run:
          name: "Verify Installation (Optional)"
          command: |
            source .venv/bin/activate
            uv tree # Check if workspace members and tools are listed
            ruff --version
            pytest --version
            mypy --version
            coverage --version
      - persist_to_workspace:
          # Persist the entire project directory, including the populated .venv
          root: .
          paths:
            - .

  # Job 2: Linting and Formatting Checks
  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Run Linting and Formatting Checks"
          command: |
            source .venv/bin/activate # Activate the venv from the workspace
            ruff check .

  # Job 3: Unit Tests and Coverage (Fast, No External Dependencies)
  unit_test:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Activate Venv and Create Test Results Directory"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/unit # Create directory for JUnit XML
      - run:
          name: "Execute Unit Test Suite (src/ tests only)"
          command: |
            source .venv/bin/activate
            # Run only unit tests from src/ directories (fast, isolated tests)
            pytest src/ --cov=src --cov-report=xml --cov-report=term \
                     --junitxml=test-results/unit/junit.xml \
                     --cov-fail-under=80
      - run:
          name: "Run Static Analysis (mypy)"
          command: |
            source .venv/bin/activate
            # Target specific source directories for mypy
            uv add types-requests
            mypy src/ --explicit-package-bases
      - store_test_results:
          path: test-results/unit
      - store_artifacts: # Store coverage reports
          path: coverage.xml
      - store_artifacts:
          path: test-results/unit

  # Job 4: Integration Tests (Without Mocks - Uses Real API Credentials)
  integration_test_with_real_apis:
    docker:
      - image: cimg/python:3.11
    # Environment variables from the 'ai-chat-orchestrator' context will be available here
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Verify Required Environment Variables"
          command: |
            echo "Checking for required environment variables..."
            missing_vars=""
            
            # Check AI credentials
            [ -z "$GEMINI_API_KEY" ] && missing_vars="$missing_vars GEMINI_API_KEY"
            
            # Check Jira credentials
            [ -z "$JIRA_CLOUD_ID" ] && missing_vars="$missing_vars JIRA_CLOUD_ID"
            [ -z "$JIRA_PROJECT_KEY" ] && missing_vars="$missing_vars JIRA_PROJECT_KEY"
            [ -z "$OAUTH_CLIENT_ID" ] && missing_vars="$missing_vars OAUTH_CLIENT_ID"
            [ -z "$OAUTH_CLIENT_SECRET" ] && missing_vars="$missing_vars OAUTH_CLIENT_SECRET"
            
            # Check Slack credentials (optional)
            [ -z "$SLACK_BOT_TOKEN" ] && echo "WARNING: SLACK_BOT_TOKEN not set"
            
            if [ -n "$missing_vars" ]; then
              echo "ERROR: Missing required environment variables:$missing_vars"
              echo "Please configure these in CircleCI Project Settings > Environment Variables"
              echo "Or add them to the 'ai-chat-orchestrator' context"
              exit 1
            else
              echo "✓ All required environment variables are present"
            fi
      - run:
          name: "Setup Database for Tests"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/integration
            # Create test database directory
            mkdir -p .test_db
            export DB_URL="sqlite:///.test_db/circleci_tokens.db"
      - run:
          name: "Execute Integration Tests (Real API Calls)"
          command: |
            source .venv/bin/activate
            # Run integration tests from tests/integration/ with real API calls
            # These tests verify component interactions with actual external services
            # Note: E2E tests are excluded as they require a running service
            pytest tests/integration/ -v \
                   --junitxml=test-results/integration/junit.xml \
                   --tb=short \
                   --no-cov
      - store_test_results:
          path: test-results/integration
      - store_artifacts:
          path: test-results/integration

  # Job 5: E2E Tests Against Deployed Service
  e2e_test_deployed:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Activate Venv and Create Test Results Directory"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/e2e
      - run:
          name: "Verify Required Environment Variables"
          command: |
            # Check if required environment variables are set
            missing_vars=""
            
            # Check AI service credentials
            [ -z "$GEMINI_API_KEY" ] && missing_vars="$missing_vars GEMINI_API_KEY"
            
            # Check deployed service URL
            [ -z "$ORCHESTRATOR_SERVICE_URL" ] && missing_vars="$missing_vars ORCHESTRATOR_SERVICE_URL"
            
            if [ -n "$missing_vars" ]; then
              echo "ERROR: Missing required environment variables:$missing_vars"
              echo "Please add these to the 'ai-chat-orchestrator' context"
              exit 1
            else
              echo "✓ All required environment variables are present"
              echo "Testing against: $ORCHESTRATOR_SERVICE_URL"
            fi
      - run:
          name: "Execute E2E Tests Against Deployed Service"
          command: |
            source .venv/bin/activate
            # Run E2E tests against deployed GCP Cloud Run service
            # These tests validate the full system end-to-end
            pytest tests/e2e/ -v \
                   --junitxml=test-results/e2e/junit.xml \
                   --tb=short \
                   --no-cov
      - store_test_results:
          path: test-results/e2e
      - store_artifacts:
          path: test-results/e2e

  # Job 6: CircleCI Tests (Unit + Integration Tests with Mocks)
  circleci_test:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Activate Venv and Create Test Results Directory"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/circleci # Separate directory for results
      - run:
          name: "Execute All Tests Except Local Credentials (With Mocks)"
          command: |
            source .venv/bin/activate
            # Run all tests from src/ and tests/integration with mocks
            # Excludes E2E tests (require running service) and local_credentials tests
            pytest src/ tests/integration/ -m "not local_credentials" \
                   --junitxml=test-results/circleci/junit.xml -v \
                   --cov=src --cov-report=term --cov-report=xml \
                   --cov-fail-under=80
      - store_test_results:
          path: test-results/circleci
      - store_artifacts:
          path: coverage.xml
      - store_artifacts:
          path: test-results/circleci



  # Job 7: Report Summary
  report_summary:
    docker:
      - image: cimg/base:stable # Use a basic image for reporting
    steps:
      - attach_workspace:
          at: . # Attach the workspace
      - run:
          name: "Summarize Unit Test Results"
          command: |
            echo "--- Unit Test Summary ---"
            if [ -f test-results/unit/junit.xml ]; then
              echo "Unit test results file found."
              # Extract test count if possible
              if command -v xmllint > /dev/null; then
                tests=$(xmllint --xpath "string(//testsuite/@tests)" test-results/unit/junit.xml 2>/dev/null || echo "N/A")
                failures=$(xmllint --xpath "string(//testsuite/@failures)" test-results/unit/junit.xml 2>/dev/null || echo "N/A")
                echo "Tests: $tests, Failures: $failures"
              fi
            else
              echo "Unit test results file (test-results/unit/junit.xml) not found."
            fi
      - run:
          name: "Summarize CircleCI Test Results"
          command: |
            echo "--- CircleCI Test Summary ---"
            if [ -f test-results/circleci/junit.xml ]; then
              echo "CircleCI test results file found."
            else
              echo "CircleCI test results file not found."
            fi
      - run:
          name: "Summarize Integration Test Results"
          command: |
            echo "--- Integration Test Summary ---"
            if [ -f test-results/integration/junit.xml ]; then
              echo "Integration test results file found."
            else
              echo "Integration test results file not found."
            fi
      - run:
          name: "Summarize E2E Test Results"
          command: |
            echo "--- E2E Test Summary ---"
            if [ -f test-results/e2e/junit.xml ]; then
              echo "E2E test results file found."
            else
              echo "E2E test results file not found."
            fi
      - run:
          name: "Display Coverage Info"
          command: |
            echo "--- Coverage Summary ---"
            if [ -f coverage.xml ]; then
               echo "Coverage XML found. Check artifacts for details."
               # Extract overall line rate if xmllint is available
               if command -v xmllint > /dev/null; then
                 coverage_rate=$(xmllint --xpath "string(//coverage/@line-rate)" coverage.xml 2>/dev/null || echo "N/A")
                 echo "Line Coverage Rate: $coverage_rate"
               fi
            else
               echo "Coverage XML not found."
            fi

# Orchestrate jobs using workflows
workflows:
  # Main workflow: Build, Lint, Test (runs on all branches)
  build_and_test:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes

      - lint:
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes

      - unit_test:
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes

      - circleci_test:
          requires:
            - unit_test # Run after unit tests pass
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes
      
      - integration_test_with_real_apis:
          requires:
            - circleci_test # Run after mock tests pass
          context: ai-chat-orchestrator # Context with real API credentials
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes

      - e2e_test_deployed:
          requires:
            - integration_test_with_real_apis # Run after integration tests pass
          context: ai-chat-orchestrator # Context with deployed service URL and credentials
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes

      # Optional: Report summary after core tests
      - report_summary:
          requires:
            - unit_test
            - circleci_test
            - integration_test_with_real_apis
            - e2e_test_deployed
          filters:
            branches:
              ignore:
                - main
                - develop
                - kamen-requierd-fixes

  # Enhanced workflow: Full tests with real credentials (main/develop only)
  full_integration:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - develop # Add other branches as needed
                - kamen-requierd-fixes

      - lint:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop
                - kamen-requierd-fixes

      - unit_test:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop
                - kamen-requierd-fixes

      - circleci_test:
          requires:
            - unit_test
          filters:
            branches:
              only:
                - main
                - develop
                - kamen-requierd-fixes

      - integration_test_with_real_apis:
          requires:
            - circleci_test # Run after mock tests pass
          context: ai-chat-orchestrator # Context with real API credentials
          filters:
            branches:
              only:
                - main
                - develop
                - kamen-requierd-fixes

      - e2e_test_deployed:
          requires:
            - integration_test_with_real_apis # Run after integration tests pass
          context: ai-chat-orchestrator # Context with deployed service URL and credentials
          filters:
            branches:
              only:
                - main
                - develop
                - kamen-requierd-fixes
                
      - report_summary:
          requires:
            - unit_test
            - circleci_test
            - integration_test_with_real_apis
            - e2e_test_deployed
          filters:
            branches:
              only:
                - main
                - develop
                - kamen-requierd-fixes